name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json declares
      # packageManager: pnpm@10.28.0, and pnpm/action-setup@v4 refuses when
      # both are set — one source of truth for the pnpm version, and it is the
      # same file that pins it for Render and for a local clone.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # §3.4 reproduces to the rupee, or nothing else matters.
      - name: reconciliation tests
        run: pnpm test

      - name: typecheck
        run: pnpm typecheck

      # The generated fixture cannot drift from the typed source.
      - name: fixtures are in sync
        run: pnpm fixtures:check

      # Every endpoint answers and validates against the shared contract.
      - name: contract conformance (mock)
        run: pnpm verify:mock

      # The web app postdates this workflow. Without these two steps the whole
      # console and landing page could break with CI still green.
      #
      # Build BEFORE typecheck, and the order is load-bearing: `LayoutProps`
      # and `PageProps` are global types Next generates into .next/types during
      # a build. A fresh checkout has no .next, so a standalone tsc run cannot
      # see them and fails on files that are perfectly correct.
      - name: web build
        run: pnpm --filter @assay/web build
        env:
          NEXT_PUBLIC_ASSAY_API: http://localhost:4318

      - name: web typecheck
        run: pnpm --filter @assay/web exec tsc --noEmit
